name: test

on:
  push:
    branches-ignore:
      - "development/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-concurrency 1

      - name: Run linter
        run: yarn lint

      - name: Build typescript
        run: yarn build
