name: test

on:
  push:
    branches-ignore:
      - "development/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-concurrency 1

      - name: Run linter
        run: yarn lint

      - name: Build typescript
        run: yarn build

      - name: Run tests
        run: yarn test
